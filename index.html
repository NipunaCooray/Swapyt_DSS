<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paediatric splenic trauma — Decision support system</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #13212c;
      --muted: #4f6272;
      --card: #ffffff;
      --line: #d3dde6;
      --brand: #17324a;
      --brand-ink: #11283b;
      --teal: #2f6fb0;
      --panel: #f1f5f9;
      --callout-bg: #e9f1fb;
      --callout-border: #cfe0f3;
      --callout-accent: #2f6fb0;
      --callout-ink: #2a4b68;
    }

    body {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #eef3f7;
      color: var(--ink);
      position: relative;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(115deg, rgba(19, 33, 44, 0.08), rgba(19, 33, 44, 0.08) 1px, transparent 1px, transparent 22px),
        repeating-linear-gradient(25deg, rgba(47, 111, 176, 0.05), rgba(47, 111, 176, 0.05) 1px, transparent 1px, transparent 28px),
        radial-gradient(circle at 20% 15%, rgba(17, 40, 59, 0.10), transparent 45%),
        radial-gradient(circle at 85% 10%, rgba(47, 111, 176, 0.08), transparent 40%);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      max-width: 100%;
      margin: 24px 0 48px;
      position: relative;
      z-index: 1;
      padding: 0 24px;
    }

    @media (min-width: 1400px) {
      .app .row.g-3 {
        --bs-gutter-x: 2rem;
      }

      .app .col-lg-8 {
        flex: 0 0 auto;
        width: 66.6667%;
      }

      .app .col-lg-4 {
        flex: 0 0 auto;
        width: 33.3333%;
      }
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    .h5 {
      font-family: "IBM Plex Serif", "Georgia", serif;
      letter-spacing: .2px;
    }

    .header-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, .98), rgba(244, 247, 250, .98));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      box-shadow: 0 12px 28px rgba(8, 40, 54, .08);
    }

    .beta-pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: .2rem .55rem;
    }

    .provenance-line {
      font-size: 12px;
    }

    .card-step {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 1rem;
      box-shadow: 0 10px 24px rgba(8, 40, 54, .08);
    }

    .alert-instruction {
      background: var(--callout-bg);
      border: 1px solid var(--callout-border);
      border-left: 6px solid var(--callout-accent);
      color: var(--brand-ink);
      font-weight: 500;
    }

    .sidebar-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(8, 40, 54, .08);
    }

    .sidebar-card h5 {
      font-size: 1rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .muted {
      color: var(--muted);
    }

    .pathway-log li {
      padding-bottom: .5rem;
      margin-bottom: .5rem;
      border-bottom: 1px solid var(--line);
    }

    #print-header {
      display: none;
    }

    .pathway-log li:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    /* The app's accent blue (also used for links and callout accents), not
       the darker --brand navy — a solid navy fill on Start pathway read as
       near-black and out-weighed the scope panel above it. */
    .btn-primary {
      background: var(--teal);
      border-color: var(--teal);
      font-weight: 600;
      letter-spacing: .02em;
    }

    .btn-primary:hover {
      background: var(--brand-ink);
      border-color: var(--brand-ink);
    }

    .btn-outline-primary {
      border-color: var(--brand);
      color: var(--brand);
    }

    .btn-outline-primary:hover {
      background: var(--brand);
      color: #fff;
    }

    .btn-outline-secondary {
      border-color: #b9c7d6;
      color: #3a4f5f;
    }

    .btn-outline-secondary:hover {
      background: #e6edf4;
      color: #263543;
    }

    .popup-link {
      color: var(--teal);
      cursor: pointer;
      font-weight: 600;
    }

    .popup-link:hover {
      text-decoration: underline;
    }

    /* Layout (display/gap/wrap) now comes from the Bootstrap utility classes
       on the element itself — .start-popup-links only styles the links. */
    .start-popup-links .popup-link {
      display: inline-block;
      line-height: 1.2;
      padding: .35rem .5rem;
      border-radius: .5rem;
      font-weight: 700;
    }

    .start-popup-links .popup-link:hover {
      text-decoration: none;
      background: #e8f2fb;
    }

    .start-popup-links .popup-link:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 1px;
      text-decoration: underline;
      background: #e8f2fb;
    }

    /* Scope panels sit inside the generic .alert-instruction highlight box;
       neutralise its own tint here so the two panels below carry the colour
       (and equal weight) instead of the frame around them. */
    .alert-instruction:has(.scope-grid) {
      background: transparent;
      border: none;
      padding: 0;
    }

    /* Consistent rhythm between card sections — same pair of values on every
       instance so the gap above and below each rule reads identically. */
    .section-divider {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 0.5px solid var(--line);
    }

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 12px;
    }

    /* Both panels share one neutral surface — the check/cross icon and the
       heading colour carry the include/exclude distinction, not the fill. */
    .scope-panel {
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .scope-panel ul {
      line-height: 1.7;
    }

    .scope-panel h6 {
      white-space: nowrap;
    }

    .scope-include h6 {
      color: var(--callout-accent);
    }

    /* Dormant: no exclusion panel exists yet (pending clinical authorship).
       Kept ready so a second .scope-panel.scope-exclude can drop in beside
       .scope-include and the grid returns to two columns unchanged. */
    .scope-exclude h6 {
      color: var(--ink);
    }

    /* Explicit two columns rather than auto-fit: the panel now spans the full
       card width, so a fixed minmax breakpoint either left a wide dead gap
       (too narrow) or collapsed to three columns (too permissive). Fixed
       column counts fill the panel cleanly at any width in between. */
    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px 24px;
    }

    @media (max-width: 480px) {
      .criteria-grid {
        grid-template-columns: 1fr;
      }
    }

    .scope-divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 12px 0;
    }

    .phase-preview {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .phase-chip {
      display: inline-flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: .25rem .65rem;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .resources-heading {
      font-size: 12px;
    }

    .resource-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resource-list li {
      display: flex;
      align-items: flex-start;
      gap: .5rem;
    }

    .resource-list .bi {
      color: var(--muted);
      flex: 0 0 auto;
      /* Align with the label's first line, not the li's full height. */
      margin-top: .15em;
    }

    /* Flex items default to min-width:auto, which refuses to shrink below the
       text's unwrapped width — without this, a long citation-style label
       (e.g. ct_scan's Kozar reference) overflows instead of wrapping. */
    .resource-list .resource-label {
      flex: 1 1 auto;
      min-width: 0;
    }

    .resource-type-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      flex: 0 0 auto;
    }

    .footer-disclaimer {
      font-size: 12px;
    }

    .decision-callout {
      background: var(--callout-bg);
      border: 1px solid var(--callout-border);
      border-left: 6px solid var(--callout-accent);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .decision-callout .title {
      font-weight: 700;
    }

    .decision-callout .hint {
      color: var(--callout-ink);
      font-size: .9rem;
    }

    /* Bootstrap's default focus ring can wash out against the tinted callout. */
    .decision-callout .btn:focus-visible {
      outline: 3px solid var(--brand-ink);
      outline-offset: 2px;
      box-shadow: none;
    }

    .log-entry {
      display: block;
      width: 100%;
      padding: 2px 0;
      margin: 0;
      border: none;
      background: none;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .log-entry:hover {
      background: var(--panel);
    }

    .log-entry:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .ext-indicator {
      font-size: .8em;
      color: var(--brand-ink);
      font-weight: 600;
      margin-left: .15em
    }

    .further-resources {
      border-top: 1px solid var(--line);
      padding-top: .75rem;
    }

    .further-resources summary {
      list-style: none;
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: .4em;
    }

    .further-resources summary::-webkit-details-marker {
      display: none;
    }

    .further-resources summary::before {
      content: "";
      width: .5em;
      height: .5em;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform .15s ease;
    }

    .further-resources[open] summary::before {
      transform: rotate(45deg);
    }

    .further-resources summary:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* The inner <ul> carries .resource-list for its icon/type-marker layout;
       this just adds the top gap between the summary and the list. */
    .further-resources ul {
      margin: .6rem 0 0;
    }

    a {
      color: var(--teal);
    }

    a:hover {
      color: #1f5a93;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    @media print {
      /* Print the log alone: the step card, navigation and chrome are screen aids. */
      .header-card, #step-container, #log-actions, .modal {
        display: none !important;
      }

      .col-lg-8 {
        display: none !important;
      }

      .col-lg-4 {
        width: 100% !important;
        max-width: 100% !important;
        flex: 0 0 100% !important;
      }

      .sidebar-card {
        border: none;
        box-shadow: none;
        padding: 0 !important;
      }

      #print-header {
        display: block !important;
      }

      .pathway-log li {
        break-inside: avoid;
      }

      .pathway-log .muted {
        display: none; /* questions are screen furniture */
      }

      #audit-render::after {
        content: "Decision support only; does not replace clinical judgement. No patient identifiers recorded by this tool.";
        display: block;
        margin-top: 1rem;
        font-size: 9pt;
      }
    }
  </style>
</head>

<body>
  <div id="sr-status" role="status" aria-live="polite" class="visually-hidden"></div>
  <div class="app container-fluid">
    <div class="header-card mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <h1 class="h4 mb-0">Paediatric splenic trauma</h1>
          <span id="beta-pill" class="badge text-bg-warning rounded-pill beta-pill">Beta</span>
        </div>
        <div class="muted provenance-line" id="provenance-line"></div>
      </div>
      <div class="d-flex gap-2">
        <button id="btn-support" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1" title="Call for support or to request transfer">
          <i class="bi bi-headset" aria-hidden="true"></i> Get support
        </button>
        <button id="btn-reset" class="btn btn-outline-secondary btn-sm">Reset</button>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div id="step-container"></div>
      </div>
      <div class="col-lg-4">
        <div class="sidebar-card p-3 mb-3">
          <div id="print-header">
            <h5 class="mb-0">Paediatric splenic trauma pathway</h5>
            <p class="muted mb-2" id="print-meta"></p>
          </div>
          <h5 class="mb-0">Pathway log</h5>
          <div id="audit-render" class="mt-2">
            <p class="muted mb-0">Your answers appear here as you work through the pathway. You can copy the summary into your notes at the end.</p>
          </div>
          <div id="log-actions" class="d-flex gap-2 mt-3 pt-3 border-top">
            <button type="button" class="btn btn-sm btn-primary" id="btn-copy-log">Copy summary</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-print-log">Print</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalPopup" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalConfirm" tabindex="-1" aria-hidden="true" aria-labelledby="modalConfirmTitle">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalConfirmTitle">Return to this point?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalConfirmBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="modalConfirmAction">Return to this step</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
